<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Phone Controller</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #0d1117;
    color: #d7e7ff;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: env(safe-area-inset-top, 10px) 14px env(safe-area-inset-bottom, 14px);
    gap: 8px;
  }
  #header {
    text-align: center;
    padding-top: 4px;
  }
  #title {
    font-size: 13px;
    letter-spacing: 0.2em;
    color: #8fd7ff;
  }
  #status {
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: #7ea2d2;
    padding: 6px 10px;
    border-radius: 10px;
    background: rgba(20,30,55,0.7);
    display: inline-block;
  }
  #status.connected { color: #7cf29b; }
  #status.error { color: #ff9a8a; }
  #driving {
    margin-top: 6px;
    font-size: 11px;
    color: #aac8ff;
    letter-spacing: 0.1em;
  }

  .section-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #547099;
    margin-bottom: 6px;
  }
  #actor-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .actor-btn {
    padding: 10px 4px;
    background: rgba(20,30,55,0.88);
    border: 1.5px solid rgba(80,130,220,0.35);
    border-radius: 12px;
    color: #d7e7ff;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.03em;
  }
  .actor-btn.pressed { background: rgba(60,100,200,0.55); }
  .actor-btn.driving { border-color: rgba(124,242,155,0.75); color: #baffcf; }

  #main-area {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 24px;
    padding-top: 4px;
  }
  .stick-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .stick-label {
    font-size: 9px;
    letter-spacing: 0.16em;
    color: #6f93c2;
  }

  #joystick-base, #orbit-base {
    position: relative;
    width: min(34vw, 170px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: rgba(20,30,55,0.6);
    border: 2px solid rgba(80,130,220,0.35);
    touch-action: none;
  }
  #orbit-base { border-color: rgba(160,120,220,0.4); }
  #joystick-thumb, #orbit-thumb {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 40%;
    height: 40%;
    border-radius: 50%;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  #joystick-thumb { background: radial-gradient(circle at 35% 30%, #9fc4ff, #3f6fcf 70%); }
  #orbit-thumb { background: radial-gradient(circle at 35% 30%, #d3aaff, #7c4fcf 70%); }

  #orbit-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #zoom-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
  }
  #zoom-track {
    position: relative;
    width: min(34vw, 170px);
    height: 32px;
    border-radius: 16px;
    background: rgba(20,30,55,0.6);
    border: 2px solid rgba(160,120,220,0.4);
    touch-action: none;
  }
  #zoom-track::before, #zoom-track::after {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    font-weight: 700;
    color: #547099;
    pointer-events: none;
  }
  #zoom-track::before { content: '\2212'; left: 8px; }
  #zoom-track::after { content: '+'; right: 8px; }
  #zoom-thumb {
    position: absolute;
    top: 50%;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #d3aaff, #7c4fcf 70%);
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    transform: translateY(-50%);
    pointer-events: none;
  }

  #actions-toggle-row {
    display: flex;
    justify-content: center;
  }
  #btn-actions-toggle {
    appearance: none;
    -webkit-appearance: none;
    padding: 9px 22px;
    background: rgba(20,30,55,0.88);
    border: 1.5px solid rgba(80,130,220,0.35);
    border-radius: 20px;
    color: #88aaee;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    font-family: 'Courier New', monospace;
  }
  #btn-actions-toggle.active {
    background: rgba(76,110,212,0.56);
    border-color: rgba(150,190,255,0.46);
    color: #f5fbff;
  }

  #bottom-area {
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  #bottom-area.expanded { display: flex; }
  #hold-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .move-btn {
    padding: 12px 6px;
    background: rgba(20,30,55,0.88);
    border: 1.5px solid rgba(80,130,220,0.35);
    border-radius: 14px;
    color: #88aaee;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.04em;
    touch-action: none;
  }
  .move-btn.pressed { background: rgba(60,100,200,0.55); color: #ffffff; transform: scale(0.96); }
  #run-btn.active { background: rgba(200,80,40,0.5); border-color: rgba(255,120,60,0.5); color: #ffaa88; }

  #perf-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .perf-btn {
    padding: 9px 4px;
    background: rgba(20,30,55,0.7);
    border: 1.5px solid rgba(80,130,220,0.28);
    border-radius: 12px;
    color: #7ea2d2;
    font-size: 9px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.02em;
    touch-action: none;
  }
  .perf-btn.pressed { background: rgba(60,100,200,0.5); color: #ffffff; }

  #retry-hint {
    text-align: center;
    font-size: 10px;
    color: #7ea2d2;
    letter-spacing: 0.05em;
  }

  /* ─── Landscape: condense the 3 header labels onto one line, pin the MOVE
     stick to the left edge and the VIEW stick + zoom bar to the right edge
     (natural two-thumb reach when holding the phone in both hands), and
     cluster the avatar switcher + actions toggle in the top-left corner out
     of the way. `#main-area` is unwrapped via `display:contents` so its two
     children (`#joystick-zone`, `#orbit-column`) can be placed into the
     outer grid independently instead of staying paired in the center. ──── */
  @media (orientation: landscape) {
    #app {
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-rows: auto auto auto 1fr;
      grid-template-areas:
        "header header header"
        "avatar .      view"
        "toggle .      view"
        "move   .      view";
      column-gap: 14px;
      row-gap: 6px;
      padding: calc(env(safe-area-inset-top, 6px) + 4px) calc(env(safe-area-inset-right, 8px) + 10px) calc(env(safe-area-inset-bottom, 6px) + 4px) calc(env(safe-area-inset-left, 8px) + 10px);
      position: relative;
    }

    #header {
      grid-area: header;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding-top: 0;
      overflow: hidden;
    }
    #title { font-size: 10px; flex-shrink: 0; }
    #status {
      margin-top: 0;
      font-size: 10px;
      padding: 3px 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 42vw;
      min-width: 0;
    }
    #driving {
      margin-top: 0;
      font-size: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .section-label, #retry-hint { display: none; }

    #actor-row {
      grid-area: avatar;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }
    .actor-btn { padding: 6px 3px; font-size: 9px; }

    #actions-toggle-row { grid-area: toggle; position: relative; z-index: 9; }
    #btn-actions-toggle { font-size: 9px; padding: 7px 8px; width: 100%; }

    #main-area { display: contents; }
    #joystick-zone { grid-area: move; justify-content: center; }
    #orbit-column { grid-area: view; justify-content: center; }
    #joystick-base, #orbit-base, #zoom-track { width: min(20vw, 130px); }

    #bottom-area.expanded {
      position: absolute;
      left: calc(env(safe-area-inset-left, 8px) + 10px);
      top: calc(env(safe-area-inset-top, 8px) + 4px);
      width: min(64vw, 280px);
      max-height: calc(100% - 16px);
      background: rgba(10,16,28,0.97);
      border: 1.5px solid rgba(80,130,220,0.4);
      border-radius: 16px;
      padding: 10px;
      z-index: 8;
      box-shadow: 0 14px 34px rgba(0,0,0,0.55);
      overflow-y: auto;
    }
  }
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <div id="title">OFFICE · PHONE CONTROL</div>
    <div id="status">Starting…</div>
    <div id="driving">DRIVING: —</div>
  </div>

  <div class="section-label">AVATAR</div>
  <div id="actor-row">
    <div class="actor-btn" id="actor-human" data-actor="human">HUMAN</div>
    <div class="actor-btn" id="actor-robot" data-actor="robot">ROBOT</div>
    <div class="actor-btn" id="actor-vrm" data-actor="vrm">WHITE MALE</div>
    <div class="actor-btn" id="actor-vita" data-actor="vita">VITA</div>
  </div>

  <div id="main-area">
    <div id="joystick-zone" class="stick-zone">
      <div id="joystick-base">
        <div id="joystick-thumb"></div>
      </div>
      <div class="stick-label">MOVE</div>
    </div>

    <div id="orbit-column">
      <div id="orbit-zone" class="stick-zone">
        <div id="orbit-base">
          <div id="orbit-thumb"></div>
        </div>
        <div class="stick-label">VIEW</div>
      </div>

      <div id="zoom-zone">
        <div id="zoom-track">
          <div id="zoom-thumb"></div>
        </div>
        <div class="stick-label">ZOOM</div>
      </div>
    </div>
  </div>

  <div id="actions-toggle-row">
    <button type="button" id="btn-actions-toggle">☰ ACTIONS ▼</button>
  </div>
  <div id="bottom-area">
    <div id="hold-row">
      <div class="move-btn" id="btn-jump">⬆ JUMP</div>
      <div class="move-btn" id="btn-wave">👋 WAVE</div>
    </div>
    <div class="move-btn" id="run-btn">🏃 RUN</div>
    <div id="perf-grid">
      <div class="perf-btn" id="btn-kick">KICK</div>
      <div class="perf-btn" id="btn-back-kick">BACK KICK</div>
      <div class="perf-btn" id="btn-full-kick">FULL KICK</div>
      <div class="perf-btn" id="btn-moonwalk">MOONWALK</div>
      <div class="perf-btn" id="btn-spin">SPIN</div>
    </div>
  </div>

  <div id="retry-hint">Tap the status banner to reconnect if it drops.</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ─── Block pinch-zoom and the double-tap/double-tap-drag zoom gesture. The
// viewport meta (user-scalable=no) covers most browsers; this is a fallback
// for the ones that still honor a fast double-tap as a zoom trigger. ────────
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

const sessionCode = new URLSearchParams(location.search).get('session');
const statusEl = document.getElementById('status');
const drivingEl = document.getElementById('driving');

let peer = null;
let conn = null;

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || '';
}

function sendMessage(obj) {
  if (conn && conn.open) {
    try { conn.send(obj); } catch (err) { /* ignore transient send failure */ }
  }
}

function highlightActiveActor(controllerName) {
  document.querySelectorAll('.actor-btn').forEach((el) => {
    const label = el.dataset.actor === 'vrm' ? 'VRM' : el.dataset.actor.toUpperCase();
    el.classList.toggle('driving', controllerName === label);
  });
}

function handleDesktopMessage(msg) {
  if (!msg || typeof msg !== 'object') return;
  if (msg.type === 'state') {
    drivingEl.textContent = 'DRIVING: ' + (msg.controller || '?') + (msg.action ? ' · ' + msg.action : '');
    highlightActiveActor(msg.controller);
    if (typeof msg.zoom === 'number' && !zoomPointerId) updateZoomVisual(msg.zoom);
  }
}

function connectToDesktop() {
  if (!sessionCode) {
    setStatus('No session code — scan the QR code on the desktop screen', 'error');
    return;
  }
  if (peer) { try { peer.destroy(); } catch (err) {} }
  conn = null;
  setStatus('Connecting…', '');
  peer = new Peer(undefined, { debug: 0 });
  peer.on('open', () => {
    conn = peer.connect('officedp-session-' + sessionCode, { reliable: true, serialization: 'json' });
    conn.on('open', () => setStatus('Connected — go drive your avatar', 'connected'));
    conn.on('data', handleDesktopMessage);
    conn.on('close', () => {
      conn = null;
      setStatus('Disconnected — tap to reconnect', 'error');
    });
    conn.on('error', () => setStatus('Connection error — tap to reconnect', 'error'));
  });
  peer.on('error', (err) => setStatus('Connection error (' + (err?.type || 'unknown') + ') — tap to reconnect', 'error'));
}

statusEl.addEventListener('click', () => {
  if (!conn || !conn.open) connectToDesktop();
});

connectToDesktop();

// ─── Avatar switch buttons ──────────────────────────────────────────────────
document.querySelectorAll('.actor-btn').forEach((el) => {
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.classList.add('pressed'); });
  const release = () => el.classList.remove('pressed');
  el.addEventListener('pointerup', (e) => {
    e.preventDefault();
    release();
    sendMessage({ type: 'switch', actor: el.dataset.actor });
  });
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', release);
});

// ─── Actions panel toggle ────────────────────────────────────────────────────
const actionsToggleBtn = document.getElementById('btn-actions-toggle');
const bottomArea = document.getElementById('bottom-area');
let actionsExpanded = false;
function syncActionsUi() {
  bottomArea.classList.toggle('expanded', actionsExpanded);
  actionsToggleBtn.classList.toggle('active', actionsExpanded);
  actionsToggleBtn.textContent = actionsExpanded ? '☰ ACTIONS ▲' : '☰ ACTIONS ▼';
}
actionsToggleBtn.addEventListener('pointerdown', (e) => e.preventDefault());
actionsToggleBtn.addEventListener('pointerup', (e) => {
  e.preventDefault();
  actionsExpanded = !actionsExpanded;
  syncActionsUi();
});
syncActionsUi();

// ─── Hold buttons (jump / wave) ─────────────────────────────────────────────
function bindHold(el, key) {
  const press = (e) => { e.preventDefault(); el.classList.add('pressed'); sendMessage({ type: 'input', key, pressed: true }); };
  const release = (e) => { if (e) e.preventDefault(); el.classList.remove('pressed'); sendMessage({ type: 'input', key, pressed: false }); };
  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', release);
}
bindHold(document.getElementById('btn-jump'), 'jump');
bindHold(document.getElementById('btn-wave'), 'wave');

// ─── Run toggle ──────────────────────────────────────────────────────────────
let runActive = false;
const runBtn = document.getElementById('run-btn');
runBtn.addEventListener('pointerdown', (e) => e.preventDefault());
runBtn.addEventListener('pointerup', (e) => {
  e.preventDefault();
  runActive = !runActive;
  runBtn.classList.toggle('active', runActive);
  sendMessage({ type: 'toggle', key: 'run' });
});

// ─── One-shot performance moves ─────────────────────────────────────────────
function bindTap(el, name) {
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.classList.add('pressed'); });
  const release = () => el.classList.remove('pressed');
  el.addEventListener('pointerup', (e) => {
    e.preventDefault();
    release();
    sendMessage({ type: 'move', name });
  });
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', release);
}
bindTap(document.getElementById('btn-kick'), 'kick');
bindTap(document.getElementById('btn-back-kick'), 'back-kick');
bindTap(document.getElementById('btn-full-kick'), 'full-kick');
bindTap(document.getElementById('btn-moonwalk'), 'moonwalk');
bindTap(document.getElementById('btn-spin'), 'spin');

// ─── Move joystick — absolute position, springs back to center on release ──
const joyBase = document.getElementById('joystick-base');
const joyThumb = document.getElementById('joystick-thumb');
let joyPointerId = null;
let joyX = 0;
let joyY = 0;
let joyLastSent = 0;

function updateJoyVisual() {
  const maxOffset = (joyBase.clientWidth - joyThumb.clientWidth) / 2;
  joyThumb.style.transform = `translate(-50%, -50%) translate(${joyX * maxOffset}px, ${joyY * maxOffset}px)`;
}

function sendJoystick(force) {
  const now = performance.now();
  if (!force && now - joyLastSent < 50) return;
  joyLastSent = now;
  sendMessage({ type: 'joystick', x: joyX, y: joyY });
}

function updateFromPointer(clientX, clientY) {
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const radius = rect.width / 2;
  let dx = (clientX - cx) / radius;
  let dy = (clientY - cy) / radius;
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  joyX = dx;
  joyY = dy;
  updateJoyVisual();
  sendJoystick(false);
}

joyBase.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  joyPointerId = e.pointerId;
  joyBase.setPointerCapture(e.pointerId);
  updateFromPointer(e.clientX, e.clientY);
});
joyBase.addEventListener('pointermove', (e) => {
  if (e.pointerId !== joyPointerId) return;
  e.preventDefault();
  updateFromPointer(e.clientX, e.clientY);
});
function endJoy(e) {
  if (e.pointerId !== joyPointerId) return;
  joyPointerId = null;
  joyX = 0;
  joyY = 0;
  updateJoyVisual();
  sendJoystick(true);
}
joyBase.addEventListener('pointerup', endJoy);
joyBase.addEventListener('pointercancel', endJoy);

updateJoyVisual();

// ─── View stick — same look as the move stick, but rate-based: holding it
// deflected continuously rotates the desktop camera (simulating a held mouse
// drag) instead of jumping to a position, and springs back to center on
// release like any joystick. ─────────────────────────────────────────────────
const orbitBase = document.getElementById('orbit-base');
const orbitThumb = document.getElementById('orbit-thumb');
let orbitPointerId = null;
let orbitX = 0;
let orbitY = 0;
const ORBIT_RATE = 14; // tuned against the desktop's CAM_DRAG_SENS for a moderate look speed at full deflection

function updateOrbitVisual() {
  const maxOffset = (orbitBase.clientWidth - orbitThumb.clientWidth) / 2;
  orbitThumb.style.transform = `translate(-50%, -50%) translate(${orbitX * maxOffset}px, ${orbitY * maxOffset}px)`;
}

function updateOrbitFromPointer(clientX, clientY) {
  const rect = orbitBase.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const radius = rect.width / 2;
  let dx = (clientX - cx) / radius;
  let dy = (clientY - cy) / radius;
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  orbitX = dx;
  orbitY = dy;
  updateOrbitVisual();
}

orbitBase.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  orbitPointerId = e.pointerId;
  orbitBase.setPointerCapture(e.pointerId);
  updateOrbitFromPointer(e.clientX, e.clientY);
});
orbitBase.addEventListener('pointermove', (e) => {
  if (e.pointerId !== orbitPointerId) return;
  e.preventDefault();
  updateOrbitFromPointer(e.clientX, e.clientY);
});
function endOrbit(e) {
  if (e.pointerId !== orbitPointerId) return;
  orbitPointerId = null;
  orbitX = 0;
  orbitY = 0;
  updateOrbitVisual();
}
orbitBase.addEventListener('pointerup', endOrbit);
orbitBase.addEventListener('pointercancel', endOrbit);

setInterval(() => {
  if (orbitX === 0 && orbitY === 0) return;
  sendMessage({ type: 'orbit', dx: orbitX * ORBIT_RATE, dy: orbitY * ORBIT_RATE });
}, 33);

updateOrbitVisual();

// ─── Zoom bar — horizontal slider below the VIEW stick, absolute position
// like a volume control. Left = zoomed out ("−"), right = zoomed in ("+").
// Passively follows the desktop's actual zoom (via the state heartbeat)
// whenever it isn't being touched, so connecting mid-session doesn't yank
// the camera to an arbitrary position. zoomValue itself stays in the same
// 0=zoomed-in..1=zoomed-out convention the desktop already expects; only the
// on-screen left/right placement is mirrored to read left-to-right. ────────
const zoomTrack = document.getElementById('zoom-track');
const zoomThumb = document.getElementById('zoom-thumb');
let zoomPointerId = null;
let zoomValue = 0.3;
let zoomLastSent = 0;

function updateZoomVisual(value) {
  zoomValue = Math.min(1, Math.max(0, value));
  const usable = Math.max(1, zoomTrack.clientWidth - zoomThumb.clientWidth);
  zoomThumb.style.left = (usable * (1 - zoomValue)) + 'px';
}

function sendZoom(force) {
  const now = performance.now();
  if (!force && now - zoomLastSent < 50) return;
  zoomLastSent = now;
  sendMessage({ type: 'zoom', value: zoomValue });
}

function updateZoomFromPointer(clientX) {
  const rect = zoomTrack.getBoundingClientRect();
  const usable = Math.max(1, rect.width - zoomThumb.clientWidth);
  const posFrac = (clientX - rect.left - zoomThumb.clientWidth / 2) / usable;
  updateZoomVisual(1 - posFrac);
  sendZoom(false);
}

zoomTrack.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  zoomPointerId = e.pointerId;
  zoomTrack.setPointerCapture(e.pointerId);
  updateZoomFromPointer(e.clientX);
});
zoomTrack.addEventListener('pointermove', (e) => {
  if (e.pointerId !== zoomPointerId) return;
  e.preventDefault();
  updateZoomFromPointer(e.clientX);
});
function endZoom(e) {
  if (e.pointerId !== zoomPointerId) return;
  zoomPointerId = null;
  sendZoom(true);
}
zoomTrack.addEventListener('pointerup', endZoom);
zoomTrack.addEventListener('pointercancel', endZoom);

updateZoomVisual(zoomValue);
</script>
